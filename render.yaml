# Render blueprint — one-click deploy of the Parts Market Research app.
#
# NOTES
# - Uses SQLite on a persistent disk (free tier has ONE free managed Postgres
#   per account, which is already used here). Data lives in /var/data/parts.db.
# - The deploy schema (prisma/schema.deploy.prisma) is a SQLite copy of the
#   main PostgreSQL schema, so the runtime client is generated from it.

services:
  - type: web
    name: partsmir
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm ci --include=dev && npx prisma generate --schema prisma/schema.test.prisma && npx prisma generate --schema prisma/schema.deploy.prisma && next build
    startCommand: npx prisma db push --schema prisma/schema.deploy.prisma && npx tsx prisma/seed.ts && npm run start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/parts.db
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_SHEETS_ENABLED
        value: "false"
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_RANGE
        value: Sheet1